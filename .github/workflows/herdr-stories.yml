name: Herdr headless stories

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      stories:
        description: Comma-separated story IDs; leave empty for the default set
        required: false
        default: ''
        type: string
      deadline-seconds:
        description: Optional shorter runner deadline for evidence checks
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: herdr-stories-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never uses onnxruntime's CUDA provider; skip its NuGet download.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  prepare:
    name: Prepare headless stories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      hc: ${{ steps.bundle.outputs.hc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm

      - name: Prepare temporary directories
        run: mkdir -p "$PWD/.spider/scratch/tmp" "$PWD/.spider/scratch/e2" "$PWD/.spider/scratch/herdr-ci"

      - name: Select stories
        id: selection
        env:
          REQUESTED_STORIES: ${{ inputs.stories }}
        run: |
          set -euo pipefail
          matrix=$(node packages/herdr/e2e/controls/ci-matrix.mjs "$REQUESTED_STORIES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # The root prepare script runs npm run build once during npm ci.
      - name: Install and build
        run: TMPDIR="$PWD/.spider/scratch/tmp" npm ci

      - name: Install the pinned Linux core
        run: |
          set -euo pipefail
          release=packages/herdr/e2e/controls/ci-stories.json
          directory="$PWD/.spider/scratch/herdr-ci"
          url=$(node -p "require('./$release').url")
          checksum=$(node -p "require('./$release').sha256")
          binary_checksum=$(node -p "require('./$release').binarySha256")
          version=$(node -p "require('./$release').version")
          curl --fail --location --silent --show-error --retry 2 "$url" -o "$directory/core.tar.gz"
          printf '%s  %s\n' "$checksum" "$directory/core.tar.gz" | sha256sum --check
          tar -xzf "$directory/core.tar.gz" -C "$directory"
          printf '%s  %s\n' "$binary_checksum" "$directory/herdr-core" | sha256sum --check
          cp "$directory/herdr-core" "$directory/hc"
          test "$("$directory/hc" --version)" = "hc $version"
          echo "SPIDER_HERDR_E2E_HC=$directory/hc" >> "$GITHUB_ENV"

      - name: Bundle shared build
        id: bundle
        run: |
          set -euo pipefail
          case "$SPIDER_HERDR_E2E_HC" in "$GITHUB_WORKSPACE"/*) ;; *) exit 1 ;; esac
          echo "hc=${SPIDER_HERDR_E2E_HC#"$GITHUB_WORKSPACE"/}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ci-core"
          cp "$SPIDER_HERDR_E2E_HC" "$RUNNER_TEMP/ci-core/hc"
          cp "$(dirname "$SPIDER_HERDR_E2E_HC")/herdr-core" "$RUNNER_TEMP/ci-core/herdr-core"
          node --version > "$RUNNER_TEMP/ci-core/node-version"
          # Stories run on Linux x64; ONNX binaries for other platforms cannot load there.
          tar -czf "$RUNNER_TEMP/herdr-build.tar.gz" \
            --exclude='node_modules/onnxruntime-node/bin/*/darwin' \
            --exclude='node_modules/onnxruntime-node/bin/*/win32' \
            --exclude='node_modules/onnxruntime-node/bin/*/linux/arm64' \
            -C "$GITHUB_WORKSPACE" node_modules dist -C "$RUNNER_TEMP" ci-core
          (cd "$RUNNER_TEMP" && sha256sum herdr-build.tar.gz > herdr-build.sha256)

      - name: Upload shared build
        uses: actions/upload-artifact@v4
        with:
          name: herdr-headless-build
          path: |
            ${{ runner.temp }}/herdr-build.tar.gz
            ${{ runner.temp }}/herdr-build.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  stories:
    name: Headless story ${{ matrix.story }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Set overall story deadline
        env:
          JOB_MINUTES: ${{ matrix.timeout }}
          SHORT_DEADLINE: ${{ inputs.deadline-seconds }}
        run: |
          set -euo pipefail
          # Measured cleanup plus archive/upload: under 8 s. Reserve 20 s
          # including initial job setup and additional upload headroom.
          seconds=$((JOB_MINUTES * 60 - 20))
          if [ -n "$SHORT_DEADLINE" ]; then
            [[ "$SHORT_DEADLINE" =~ ^[1-9][0-9]{0,2}$ ]] || exit 1
            (( SHORT_DEADLINE <= seconds )) || exit 1
            seconds="$SHORT_DEADLINE"
          fi
          echo "SPIDER_HERDR_E2E_DEADLINE=$(( $(date +%s%3N) + seconds * 1000 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'

      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: herdr-headless-build
          path: ${{ runner.temp }}

      - name: Restore shared build
        env:
          HC_RELATIVE_PATH: ${{ needs.prepare.outputs.hc }}
        run: |
          set -euo pipefail
          case "$HC_RELATIVE_PATH" in .spider/*/herdr-ci/hc) ;; *) exit 1 ;; esac
          (cd "$RUNNER_TEMP" && sha256sum --check herdr-build.sha256)
          tar -xzf "$RUNNER_TEMP/herdr-build.tar.gz" -C "$GITHUB_WORKSPACE"
          test "$(node --version)" = "$(<ci-core/node-version)"
          directory="$(dirname "$GITHUB_WORKSPACE/$HC_RELATIVE_PATH")"
          parent="$(dirname "$directory")"
          mkdir -p "$directory" "$parent/tmp" "$parent/e2"
          install -m 755 ci-core/hc "$directory/hc"
          install -m 755 ci-core/herdr-core "$directory/herdr-core"
          rm -r ci-core
          checksum=$(node -p "require('./packages/herdr/e2e/controls/ci-stories.json').binarySha256")
          printf '%s  %s\n' "$checksum" "$directory/hc" | sha256sum --check
          echo "SPIDER_HERDR_E2E_HC=$directory/hc" >> "$GITHUB_ENV"

      # hc otherwise selects /run/user/<uid> instead of each fixture's state home.
      - name: Remove runner runtime directory
        run: |
          rundir="/run/user/$(id -u)"
          if mountpoint -q "$rundir"; then sudo umount -l "$rundir"; fi
          sudo rm -rf "$rundir"
          test ! -e "$rundir"

      - name: Run headless story
        timeout-minutes: ${{ matrix.story == 'R05' && 1 || matrix.timeout }}
        env:
          STORY: ${{ matrix.story }}
          STEP_MINUTES: ${{ matrix.story == 'R05' && 1 || matrix.timeout }}
        run: |
          set -euo pipefail
          step_deadline=$(( $(date +%s%3N) + (STEP_MINUTES * 60 - 20) * 1000 ))
          if (( step_deadline < SPIDER_HERDR_E2E_DEADLINE )); then
            export SPIDER_HERDR_E2E_DEADLINE="$step_deadline"
          fi
          stories="$STORY"
          env -u PI_SUBAGENT_CHILD -u PI_SUBAGENT_RUN_ID -u PI_SPIDER_DB_PATH -u PI_SPIDER_SESSION_ID -u SPIDER_HERDR_E2E -u SPIDER_HERDR_APP_TESTS -u SPIDER_HERDR_REAL_MACHINE -u SPIDER_HERDR_TEST_DISPLAY_UUID XDG_RUNTIME_DIR= TMPDIR="$PWD/.spider/scratch/tmp" npm run test:herdr:e2e -- --built --tier headless --story "$stories"

      - name: Archive failure artifacts
        if: failure()
        run: |
          if [ -d "$PWD/.spider/scratch/e2" ]; then
            mkdir -p "$PWD/.spider/scratch/herdr-ci"
            tar --ignore-failed-read -czf "$PWD/.spider/scratch/herdr-ci/e2.tar.gz" -C "$PWD/.spider/scratch" e2
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-headless-failures-${{ matrix.story }}
          path: .spider/scratch/herdr-ci/e2.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
