name: Herdr setup release hunt

on:
  push:
    branches: [ci/hsr-hunt]

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        lane: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
      - run: npm ci
      - name: Match PR fixture socket configuration
        run: |
          rundir="/run/user/$(id -u)"
          if mountpoint -q "$rundir"; then sudo umount -l "$rundir"; fi
          sudo rm -rf "$rundir"
          test ! -e "$rundir"
          mkdir -p "$PWD/.spider/scratch/tmp" hsr-results
          lscpu
          node --version
      - name: Run the first candidate trial
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python3 scripts/hsr-look-profile.py
          bash scripts/hsr-trials.sh "$LANE" after-first
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsr-preview-${{ matrix.lane }}
          path: hsr-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsr-${{ matrix.lane }}
          path: hsr-results
          if-no-files-found: error
