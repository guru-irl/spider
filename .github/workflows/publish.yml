name: Publish to npm

# Manual only. GitHub releases do not start this workflow.
# Configure the npm token and protected npm-publish environment before use.
# See docs/release-process.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires a repo Settings -> Environments entry literally named
    # "npm-publish" with required reviewers configured BEFORE the first release,
    # or GitHub auto-creates it with no protection rules on first use and this
    # runs unattended. Nothing in this repo can assert the protection rules
    # exist from inside the workflow; see docs/release-process.md for the exact
    # steps. Remove this line entirely if unattended publishing is intended.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Check lockfile registry
        run: node scripts/check-lockfile-registry.mjs

      - name: Install
        run: npm ci

      # A manual dispatch must agree with the package version too.
      - name: Verify release tag matches package.json version
        env:
          REL_TAG: ${{ inputs.tag }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$REL_TAG package.json=$PKG"
          if [ "$REL_TAG" != "v$PKG" ]; then
            echo "::error::Tag $REL_TAG does not match package.json version $PKG at this ref"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Refuse to republish a version that already exists rather than failing
      # deep inside npm publish with a 403.
      - name: Check version is unpublished
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER is already published"
            exit 1
          fi
          echo "$NAME@$VER is not yet published"

      - name: Publish
        run: |
          mkdir -p "$PWD/.spider/scratch/tmp" "$PWD/.spider/scratch/packaging"
          export TMPDIR="$PWD/.spider/scratch/tmp"
          export npm_config_foreground_scripts=false npm_config_pack_destination="$PWD/.spider/scratch/packaging"
          npm pack --json --ignore-scripts | node -e "require('./scripts/check-package-files.cjs')"
          TARBALL=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('.spider/scratch/packaging/pack.json', 'utf8'))[0].filename)")
          node scripts/assert-bundle.mjs --package ".spider/scratch/packaging/$TARBALL" --commit "$(git rev-parse --short HEAD)"
          npm publish ".spider/scratch/packaging/$TARBALL" --ignore-scripts --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
