name: Release

# Tag-driven. Push a v-prefixed tag and this builds, verifies, and cuts a GitHub
# Release. Publishing to npm is a SEPARATE workflow triggered by the release
# being published, so a bad build can never reach the registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build · verify · draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so release notes can diff against the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm

      - name: Install
        run: npm ci

      # A tag that disagrees with package.json produces a release whose artifact
      # version does not match its name. Fail loudly instead.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Proves the tarball npm would publish actually contains the bundle,
      # before anything is released.
      - name: Verify package contents
        run: |
          npm pack --dry-run
          npm pack --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const files=JSON.parse(s)[0].files.map(f=>f.path);
              const need=['dist/extension.js','README.md','LICENSE'];
              const missing=need.filter(n=>!files.some(f=>f===n||f.startsWith(n)));
              if(missing.length){console.error('::error::missing from tarball: '+missing.join(', '));process.exit(1);}
              console.log('tarball contains '+files.length+' files, required entries present');
            });"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
