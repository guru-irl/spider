name: Release

# A version tag runs the complete CI gate before publishing an installable
# GitHub release. The repository token is sufficient. npm stays manual.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: .spider/scratch/packaging

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="guru-irl-spider-$VERSION.tgz"
          (cd .spider/scratch/packaging && sha256sum "$TARBALL" > SHA256SUMS)
          INSTALL="pi install npm:@guru-irl/spider@https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$TARBALL"
          printf '## Install\n\n```sh\n%s\n```\n\nSHA-256 is in the attached `SHA256SUMS` file.\n' "$INSTALL" > .spider/scratch/packaging/notes.md
          gh release create "$GITHUB_REF_NAME" \
            ".spider/scratch/packaging/$TARBALL" \
            .spider/scratch/packaging/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file .spider/scratch/packaging/notes.md \
            --verify-tag
