name: roam speed hunt
on:
  push:
    branches: [ci/spd-roam-hunt]
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  measure:
    name: Five uninstrumented three-worker trials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      - name: Run trials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spider/scratch/tmp .spider/scratch/roam-metrics
          cat > .spider/scratch/roam-runner.mjs <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { TestRunner } from 'vitest';
          export default class RoamRunner extends TestRunner {
            onBeforeCollect(files) {
              if (files.length !== 1) throw new Error('need one file per fork');
              appendFileSync(process.env.SPDR_WORKERS, JSON.stringify([process.pid, files[0], Date.now()]) + '\n');
            }
          }
          EOF
          cat > .spider/scratch/roam-vitest.mts <<'EOF'
          import config from '../../vitest.config';
          export default { ...config, test: { ...config.test, runner: './.spider/scratch/roam-runner.mjs' } };
          EOF
          cat > .spider/scratch/roam-summary.py <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          data = json.loads((root / 'vitest.json').read_text())
          workers = [json.loads(line) for line in (root / 'workers').read_text().splitlines()]
          pids = {row[0] for row in workers}
          print('workers', workers)
          print('passed', data['numPassedTests'], 'failed', data['numFailedTests'], 'pending', data['numPendingTests'])
          cases = [t for file in data['testResults'] for t in file['assertionResults'] if t['title'].startswith('streams a binary and session artifact above 64 MiB')]
          for case in cases:
              print('large case', case['title'], case['status'], case.get('duration'))
          if not data['success'] or len(pids) < 3 or len(cases) != 2 or any(c['status'] != 'passed' for c in cases):
              raise SystemExit('trial did not execute all required work')
          if not (root / 'tmpfs-seen').read_text().strip():
              raise SystemExit('no large fixture observed on tmpfs')
          PY
          stat -f -c 'Large fixture candidate /dev/shm: %T, %a blocks x %s bytes free' /dev/shm
          tests=(packages/roam/src/__tests__/{artifacts,cli-package,provision-adapter,move}.test.ts)
          for i in 1 2 3 4 5; do
            echo "::group::Trial $i"
            dir="$PWD/.spider/scratch/roam-metrics/$i"
            mkdir -p "$dir"
            export SPDR_WORKERS="$dir/workers" TMPDIR="$PWD/.spider/scratch/tmp"
            (while :; do find /dev/shm -maxdepth 1 -type d -name 'spider-artifact-*' -print >> "$dir/tmpfs-seen"; sleep 0.1; done) &
            monitor=$!
            rc=0
            env -u PI_SUBAGENT_CHILD -u PI_SUBAGENT_RUN_ID -u PI_SPIDER_DB_PATH -u PI_SPIDER_SESSION_ID -u XDG_RUNTIME_DIR \
              node_modules/.bin/vitest run "${tests[@]}" --maxWorkers=3 --minWorkers=3 --config ./.spider/scratch/roam-vitest.mts \
              --reporter=default --reporter=json --outputFile="$dir/vitest.json" || rc=$?
            kill "$monitor" || true
            wait "$monitor" 2>/dev/null || true
            echo "Trial $i exit $rc"
            python3 .spider/scratch/roam-summary.py "$dir" | tee "$dir/summary.txt"
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
            echo '::endgroup::'
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roam-fix-metrics
          path: .spider/scratch/roam-metrics/*/*
          include-hidden-files: true
          retention-days: 7
