name: Replay artifact bytes

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
      - name: Rebuild historical outputs with their locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/replay-output-hashes.ndjson"
          dir="$RUNNER_TEMP/replay-checkout"
          git worktree add --detach --no-checkout "$dir" HEAD
          mkdir -p "$dir/.spider/scratch/tmp"
          failed=0
          while IFS= read -r head; do
            [[ "$head" =~ ^[0-9a-f]{40}$ ]]
            echo "::group::$head"
            if ! git cat-file -e "$head^{commit}" && ! git fetch --no-tags origin "$head"; then
              failed=1
              echo '::endgroup::'
              continue
            fi
            git -C "$dir" checkout --detach "$head"
            test ! -e "$dir/dist"
            test "$(git -C "$dir" rev-parse HEAD)" = "$head"
            if ! (cd "$dir" && TMPDIR="$dir/.spider/scratch/tmp" npm ci); then
              failed=1
              if [ -e "$dir/dist" ]; then mv "$dir/dist" "$RUNNER_TEMP/dist-$head"; fi
              echo '::endgroup::'
              continue
            fi
            node --input-type=module - "$dir" "$head" <<'JS' >> "$RUNNER_TEMP/replay-output-hashes.ndjson"
          import { execFileSync } from 'node:child_process';
          import { bundleDigest } from './scripts/selection/bundle-keys.mjs';
          const [dir, head] = process.argv.slice(2);
          const git = (...args) => execFileSync('git', args, { cwd: dir, encoding: 'utf8' }).trim();
          const paths = ['dist/intercom/broker.mjs', 'dist/herdr/feed-reader.mjs', 'dist/herdr/viewer.mjs', 'dist/herdr/viewer-pi.mjs'];
          console.log(JSON.stringify({ head, lock: git('rev-parse', 'HEAD:package-lock.json'), node: process.version,
            files: Object.fromEntries(paths.map(file => [file, bundleDigest(dir, file)])) }));
          JS
            mv "$dir/dist" "$RUNNER_TEMP/dist-$head"
            echo "::endgroup::"
          done < scripts/selection/replay-byte-heads.txt
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-output-hashes
          path: ${{ runner.temp }}/replay-output-hashes.ndjson
          if-no-files-found: error
          retention-days: 7
