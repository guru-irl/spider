name: selection map
on: workflow_dispatch
permissions:
  contents: read
jobs:
  linux-kernel-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }
      - run: >-
          node --test --test-concurrency=1
          --test-name-pattern 'kernel trace attributes|Node test supervisor|nested recorder keeps'
          scripts/selection/recorder.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-kernel-trace
          path: .spider/scratch/selection/recorder-*
          include-hidden-files: true
          retention-days: 7
